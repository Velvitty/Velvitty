// Interpolate adjacent 120 Hz states at the display's actual refresh times.

function createBeltInterpolator(initial=0){
  let previous=initial,next=initial+MOBIUS_FRAME_STEP,accumulator=0,debt=0;

      const interval=cadence.slice().sort((a,b)=>a-b)[4];
