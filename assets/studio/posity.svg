.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 30s linear infinite}
.float{animation:float 9s ease-in-out infinite}.float2{animation:float 9s ease-in-out -3s infinite}
.pulse{animation:pulse 5s ease-in-out infinite}.sweep{animation:sweep 7s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:center;animation:bar 3.3s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-12px)}}
@keyframes pulse{50%{opacity:.45}}@keyframes sweep{50%{transform:translateX(60px)}}
@keyframes bar{50%{transform:scaleY(.5)}}
@media(prefers-reduced-motion:reduce){.orbit,.float,.float2,.pulse,.sweep,.bar{animation:none!important}}
